spring:

  application:
    name: social-media-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:database}:${DB_PORT:5432}/${DB_NAME:thecodecompany_social_media_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:cache}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 600000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:create-drop}
    show-sql: ${HIBERNATE_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    database: postgresql

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:custom-secret-key}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:604800000}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}

    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${OAUTH2_GOOGLE_CLIENT_ID:placeholder-id}
              client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:placeholder-secret}
              scope:
                - email
                - profile
              redirect-uri: ${OAUTH2_GOOGLE_REDIRECT_URI:http://localhost:8000/login/oauth2/code/google}
              client-name: Google
          provider:
            google:
              authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
              token-uri: https://oauth2.googleapis.com/token
              user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
              user-name-attribute: sub

google:
  android:
    client-id: ${OAUTH2_GOOGLE_ANDROID_CLIENT_ID:placeholder-android}
  ios:
    client-id: ${OAUTH2_GOOGLE_IOS_CLIENT_ID:placeholder-ios}

server:
  port: 8000