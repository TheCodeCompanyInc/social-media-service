spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
  cache:
    type: redis
    redis:
      time-to-live: 600000
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          time_zone: UTC
    database: h2
  application:
    security:
      jwt:
        secret-key: custom-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-algorithm-security
        access-token-expiration: 604800000
        refresh-token-expiration: 2592000000
        vehicle-token-expiration: 604800000
        vehicle-refresh-token-expiration: 2592000000
    
  mail:
    host: smtp.gmail.com
    port: 587
    username: test@example.com
    password: test-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
            client-name: Google

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

google:
  android:
    client-id: google-client-id-for-android.apps.googleusercontent.com
  ios:
    client-id: google-client-id-for-ios.apps.googleusercontent.com
