spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/thecodecompany_social_media_db
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver
    data:
        redis:
            host: localhost
            port: 6379
            password: ""
    cache:
        type: redis
        redis:
            time-to-live: 600000
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
                jdbc:
                    time_zone: UTC
        database: postgresql
    application:
        security:
            jwt:
                secret-key: custom-secret-key
                access-token-expiration: 604800000
                refresh-token-expiration: 2592000000
    mail:
        host: smtp.gmail.com
        port: 587
        username:  # your smtp gmail
        password:  # the password of the smtp gmail
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${OAUTH2_GOOGLE_CLIENT_ID:placeholder-id}
                        client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:placeholder-secret}
                        scope:
                            - email
                            - profile
                        redirect-uri: ${OAUTH2_GOOGLE_REDIRECT_URI:http://localhost:8000/login/oauth2/code/google}
                        client-name: Google
                provider:
                    google:
                        authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
                        token-uri: https://oauth2.googleapis.com/token
                        user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
                        user-name-attribute: sub

google:
    android:
         client-id: ${OAUTH2_GOOGLE_ANDROID_CLIENT_ID:placeholder-android}
    ios:
         client-id: ${OAUTH2_GOOGLE_IOS_CLIENT_ID:placeholder-ios}

server:
    port: 8080